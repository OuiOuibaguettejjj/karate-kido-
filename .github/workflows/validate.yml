name: Validate prototype
on:
  pull_request:
    branches: [main, codex/phase-1-prototype-2d]
  push:
    branches: [codex/phase-2-pixel-art-rebuild]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Run gameplay smoke test
        run: node tests/smoke.cjs
      - name: Check required interface hooks
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const j=fs.readFileSync('game.js','utf8'); for (const id of ['game','home-screen','dojo-screen','profile-screen','pause-screen','over-screen','left-button','right-button','timer-fill']) if (!h.includes('id=\"'+id+'\"')) throw new Error('Missing HTML id: '+id); for (const id of ['play-button','retry-button','resume-button','quit-button','buy-breath','buy-focus']) if (!j.includes(id)) throw new Error('Missing game handler: '+id);"
